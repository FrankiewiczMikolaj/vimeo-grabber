name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install matching Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Install owned-media and native-dialog tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg libgtk-3-0t64
      - name: Verify extension
        run: pnpm verify
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromium-evidence
          path: artifacts/headed/
          if-no-files-found: warn
          retention-days: 14
      - name: Package extension
        working-directory: dist
        run: |
          zip -r ../vimeo-grabber.zip .
          unzip -t ../vimeo-grabber.zip
          unzip -p ../vimeo-grabber.zip manifest.json > /dev/null
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const m = JSON.parse(fs.readFileSync('manifest.json')); const p = JSON.parse(fs.readFileSync('../package.json')); assert.equal(m.version, p.version); for (const f of [m.action.default_popup, m.background.service_worker, ...m.content_scripts.flatMap(s => s.js)]) assert.ok(fs.statSync(f).isFile(), f);"
      - name: Upload identified extension zip
        uses: actions/upload-artifact@v7
        with:
          name: vimeo-grabber-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}-${{ github.sha }}
          path: vimeo-grabber.zip
          if-no-files-found: error
          retention-days: 14
